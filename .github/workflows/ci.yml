name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: zig build test (native — this is where correctness is checked)
        working-directory: core
        run: zig build test --summary all
      - name: zig build wasm (delivery target — compiles only, no test)
        working-directory: core
        run: zig build wasm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v5+ caches automatically when `package.json` names a
          # package manager. This repo's doesn't, so that's inert today --
          # but it would engage from the *repo root*, where there is no
          # `package.json` or lockfile at all (npm lives in `web/`), so
          # adding a `packageManager` field later would break CI from a
          # direction nobody would think to look. Off explicitly instead. To
          # turn caching on properly it needs
          # `cache-dependency-path: web/package-lock.json`.
          package-manager-cache: false
      # Needed transitively: `npm run build`/`test:e2e` both trigger
      # `predev`/`prebuild` -> `scripts/sync-core.mjs`, which runs
      # `zig build wasm` to produce the module `web/` actually ships.
      #
      # Still on the Node 20 runtime, so GitHub's deprecation notice names it
      # on every run. Not a version we can bump past: v2.2.1 is the latest
      # release and `main` is `node20` too, so this waits on upstream. The
      # runner forces it onto Node 24 regardless, so it's noise, not breakage.
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Lint (oxlint)
        working-directory: web
        run: npm run lint
      - name: Typecheck (tsc -b)
        working-directory: web
        run: npx tsc -b
      - name: Unit tests (vitest)
        working-directory: web
        run: npm run test
      - name: End-to-end tests (playwright — builds + previews the production bundle)
        working-directory: web
        run: npm run test:e2e
      # ENG-70's header regression guard, without needing `deploy.yml`'s
      # Cloudflare credentials: `wrangler dev` is Cloudflare's own local
      # emulator, running the same `wrangler.jsonc` and `_headers` the real
      # deploy does, so this exercises the same header-application logic.
      # `dist/` is already built by the e2e step above.
      - name: Verify Cloudflare headers (wrangler dev, no credentials needed)
        working-directory: web
        run: npm run verify-headers:local
