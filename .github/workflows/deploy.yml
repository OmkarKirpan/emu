name: Deploy

# ENG-70 (M5): deploys the production build to Cloudflare, then verifies
# cross-origin isolation on the *deployed* URL -- the acceptance criterion is
# explicitly "verified against the real production build (not just `vite
# preview`)", and a host that ignores `dist/_headers` fails in a way no local
# check can see (see `web/scripts/check-headers.mjs`).
#
# Cloudflare, not GitHub Pages: this app cannot run without
# `Cross-Origin-Opener-Policy`/`Cross-Origin-Embedder-Policy` response
# headers (no cross-origin isolation -> no `SharedArrayBuffer` -> the
# shared-memory wasm module refuses to instantiate), and GitHub Pages has no
# mechanism for setting custom response headers at all. See README.md.
#
# Specifically a Worker serving static assets, not a Pages project -- see
# `web/wrangler.jsonc`, which carries that whole story. Both honour
# `dist/_headers`, which is the only property this app actually needs.
#
# `ci.yml` already runs this same check-headers.mjs against `wrangler dev`
# (Cloudflare's local emulator, same runtime path) on every PR, with no
# credentials needed -- that's the regression guard. What only this workflow
# can verify is the one thing the emulator can't stand in for: that the real
# Cloudflare-side project is actually serving this repo's `dist/`.
#
# ## Required repository secrets
#   CLOUDFLARE_API_TOKEN   -- a token with the "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  -- from the Cloudflare dashboard URL / account home
# ## Required one-time setup
#   None on the Cloudflare side: `wrangler deploy` creates the Worker named
#   in `web/wrangler.jsonc` on first run. Set the `DEPLOY_ENABLED` repository
#   variable to `true` to arm this workflow.

on:
  push:
    branches: [main]
  # Deploying is also useful on demand -- e.g. to re-verify headers after
  # changing Cloudflare-side settings without pushing a commit.
  workflow_dispatch:

env:
  # Fallback for the post-deploy header check only; the deployed name itself
  # comes from `web/wrangler.jsonc`.
  PRODUCTION_URL: https://emu.okirpan.workers.dev

# Never let two deploys race to the same environment.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without the secrets configured this job can only fail confusingly, so
    # skip it outright until someone has done the one-time setup above.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm run build` -> `prebuild` -> `scripts/sync-core.mjs` -> `zig build
      # wasm`: the wasm module is generated at build time, never committed.
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

      # `wrangler deploy`, driven by `web/wrangler.jsonc` -- a Worker serving
      # static assets, not a Pages project. See that file for why; the short
      # version is that Cloudflare's dashboard no longer reliably creates
      # Pages projects, and `pages deploy` then fails with "the Pages project
      # does not exist" no matter how the project was set up.
      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      # The actual ENG-70 acceptance check. Prefers `deployment-url` (the
      # per-deploy URL, so it verifies the build just uploaded rather than
      # whatever the alias currently points at) and falls back to the stable
      # production URL if the action didn't surface one -- an empty URL would
      # otherwise make `check-headers.mjs` fail on usage rather than on
      # anything it actually checked.
      - name: Verify cross-origin isolation on the deployed build
        working-directory: web
        run: node scripts/check-headers.mjs "${{ steps.deploy.outputs.deployment-url || env.PRODUCTION_URL }}"
